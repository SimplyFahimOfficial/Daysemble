# Main branch CI: the same Android validation used for pull requests, on the merged commit.
# Production signing is intentionally reserved for version-tag releases in release.yml.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  android:
    name: Android
    uses: ./.github/workflows/android-build.yml
    permissions:
      contents: read
