# Main branch CI. The same build as pull requests (android-build.yml), on the merged commit,
# plus an optional signed release check. release.yml only publishes a tag whose commit passed
# this workflow, so runs on main are never cancelled.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  android:
    name: Android
    uses: ./.github/workflows/android-build.yml
    permissions:
      contents: read

  # Optional signed release check for pushes to main (already-reviewed code).
  # Two independent guards keep signing away from pull requests:
  #   1. this workflow has no pull_request trigger, and the `if` limits the job to main;
  #   2. the signing secrets live only in the `release` environment, which allows deployments
  #      from `main` (and release tags) only. See docs/RELEASE.md.
  # Unless all four environment secrets are set, the job finishes without building.
  # The signed APK is not uploaded; release.yml builds and publishes releases.
  signed-release:
    name: Signed release check
    if: github.ref == 'refs/heads/main'
    needs: android
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # Signing runs only when all four secrets are set. Only secret names are ever printed.
      - name: Check for signing secrets
        id: keys
        shell: bash
        env:
          DAYSEMBLE_KEYSTORE_BASE64: ${{ secrets.DAYSEMBLE_KEYSTORE_BASE64 }}
          DAYSEMBLE_KEYSTORE_PASSWORD: ${{ secrets.DAYSEMBLE_KEYSTORE_PASSWORD }}
          DAYSEMBLE_KEY_ALIAS: ${{ secrets.DAYSEMBLE_KEY_ALIAS }}
          DAYSEMBLE_KEY_PASSWORD: ${{ secrets.DAYSEMBLE_KEY_PASSWORD }}
        run: |
          missing=()
          for name in DAYSEMBLE_KEYSTORE_BASE64 DAYSEMBLE_KEYSTORE_PASSWORD DAYSEMBLE_KEY_ALIAS DAYSEMBLE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Signed release skipped::Missing release environment secrets: ${missing[*]}. Skipping the signed release build."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.keys.outputs.present == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.keys.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android platform 37
        if: steps.keys.outputs.present == 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.keys.outputs.present == 'true'
        with:
          cache-provider: basic
          # The job that holds secrets reads the cache but never writes it.
          cache-read-only: true

      - name: Decode release keystore
        if: steps.keys.outputs.present == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.DAYSEMBLE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "DAYSEMBLE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Signed release build (R8)
        if: steps.keys.outputs.present == 'true'
        run: ./gradlew assembleRelease
        env:
          DAYSEMBLE_KEYSTORE_PASSWORD: ${{ secrets.DAYSEMBLE_KEYSTORE_PASSWORD }}
          DAYSEMBLE_KEY_ALIAS: ${{ secrets.DAYSEMBLE_KEY_ALIAS }}
          DAYSEMBLE_KEY_PASSWORD: ${{ secrets.DAYSEMBLE_KEY_PASSWORD }}

      # app/build.gradle.kts falls back to an unsigned build (app-release-unsigned.apk) when any signing
      # variable is missing, and Gradle still succeeds. Fail here instead of reporting a signed build that
      # isn't one. Prints only pass/fail, not certificate details.
      - name: Verify release APK is signed
        if: steps.keys.outputs.present == 'true'
        shell: bash
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error title=Release APK not signed::$apk was not produced (the build fell back to unsigned)."
            exit 1
          fi
          if ! "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk" > /dev/null 2>&1; then
            echo "::error title=Release APK not signed::apksigner could not verify $apk."
            exit 1
          fi
          echo "Release APK signature verified."

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
