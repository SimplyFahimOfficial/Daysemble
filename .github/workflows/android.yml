name: Android CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: checkout of this (private) repo is the only thing that needs the token.
# Artifact upload uses the runner's own Actions token, not GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Routine CI for pushes and pull requests. Uses no secrets: the R8 release build is unsigned.
  build:
    # Pinned image instead of ubuntu-latest, which moves to Ubuntu 26.04 from 2026-10-19
    # (actions/runner-images#14748). Move deliberately once 26.04 has been verified.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # MIT-licensed caching. The default 'enhanced' provider is a proprietary component
          # with separate terms (see gradle/actions DISTRIBUTION.md); opt in deliberately if wanted.
          cache-provider: basic

      - name: Build, unit tests and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace

      - name: Release build (R8, unsigned)
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daysemble-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # Optional signed release check, only for pushes to main (already-reviewed code).
  # Two independent guards keep signing away from pull requests:
  #   1. this `if` means the job is never scheduled for pull_request runs;
  #   2. the signing secrets live only in the `release` environment, which should allow
  #      deployments from `main` only (see README, "Signed release builds in CI").
  # Without the environment secrets the job finishes without building. The signed APK is not uploaded.
  signed-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check for signing secrets
        id: keys
        env:
          KEYSTORE_BASE64: ${{ secrets.DAYSEMBLE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets set; skipping the signed release build."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.keys.outputs.present == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.keys.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android platform 37
        if: steps.keys.outputs.present == 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.keys.outputs.present == 'true'
        with:
          cache-provider: basic
          # The job that holds secrets reads the cache but never writes it.
          cache-read-only: true

      - name: Decode release keystore
        if: steps.keys.outputs.present == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.DAYSEMBLE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "DAYSEMBLE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Signed release build (R8)
        if: steps.keys.outputs.present == 'true'
        run: ./gradlew assembleRelease
        env:
          DAYSEMBLE_KEYSTORE_PASSWORD: ${{ secrets.DAYSEMBLE_KEYSTORE_PASSWORD }}
          DAYSEMBLE_KEY_ALIAS: ${{ secrets.DAYSEMBLE_KEY_ALIAS }}
          DAYSEMBLE_KEY_PASSWORD: ${{ secrets.DAYSEMBLE_KEY_PASSWORD }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
