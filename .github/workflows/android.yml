name: Android CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, unit tests and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace

      # Optional signing: set repository secrets DAYSEMBLE_KEYSTORE_BASE64, DAYSEMBLE_KEYSTORE_PASSWORD,
      # DAYSEMBLE_KEY_ALIAS and DAYSEMBLE_KEY_PASSWORD. Without them the release APK is built unsigned.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DAYSEMBLE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "DAYSEMBLE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Release build (R8)
        run: ./gradlew assembleRelease
        env:
          DAYSEMBLE_KEYSTORE_PASSWORD: ${{ secrets.DAYSEMBLE_KEYSTORE_PASSWORD }}
          DAYSEMBLE_KEY_ALIAS: ${{ secrets.DAYSEMBLE_KEY_ALIAS }}
          DAYSEMBLE_KEY_PASSWORD: ${{ secrets.DAYSEMBLE_KEY_PASSWORD }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: daysemble-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
