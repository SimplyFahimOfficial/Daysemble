# Dependabot version updates
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Security (Dependabot) *alerts* and automatic *security* update PRs are enabled
# separately in the GitHub UI (Settings -> Code security). This file only
# controls scheduled *version* update PRs.
version: 2
updates:
  # Gradle / Android dependencies declared via the version catalog
  # (gradle/libs.versions.toml) and the build.gradle.kts files.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "android"
    # Group all non-major Gradle bumps into a single PR to reduce noise.
    groups:
      gradle-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by the workflows under .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns:
          - "*"
